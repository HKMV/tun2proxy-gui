[dependencies.anyhow]
version = "1.0.79"

[dependencies.gpui]
version = "1.14.2"
package = "gpui-unofficial"

[dependencies.gpui_platform]
version = "1.14.2"
features = ["font-kit"]
package = "gpui-platform-gpui-unofficial"

[dependencies.gpui_util]
version = "1.14.2"
optional = true
package = "gpui-util-gpui-unofficial"

[dependencies.log]
version = "0.4"

[dependencies.mdstitch]
version = "0.1"
optional = true

[dependencies.pulldown-cmark]
version = "0.13.4"
features = ["simd"]
default-features = false

[dependencies.rust-embed]
version = "8.2.0"

[dependencies.schemars]
version = "0.8"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.syntect]
version = "5.3.0"
optional = true

[dependencies.unicode-bidi]
version = "0.3"

[dependencies.unicode-segmentation]
version = "1.10"

[dependencies.web-time]
version = "1"

[dev-dependencies.pretty_assertions]
version = "1.4"

[dev-dependencies.tempfile]
version = "3.8"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.gpui]
version = "1.14.2"
features = ["test-support"]
