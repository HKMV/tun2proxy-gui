[package]
name = "tun2proxy-gui"
version = "0.3.11"
edition = "2021"
rust-version = "1.95"
description = "Cross-platform desktop GUI for tun2proxy"
authors = ["HKMV"]
license = "MIT"
repository = "https://github.com/HKMV/tun2proxy-gui"

[dependencies]
# GPUI：GPU 加速的 Rust 原生桌面 UI（Windows / macOS / Linux 同一套渲染管线）。
#
# 版本必须**精确锁定**：gpuikit 0.9 只对得上 gpui-unofficial 1.14.2 的 API，
# 而 1.x 之间并不兼容（1.26 就把 `Window::blur` 改成了带参数的签名，
# gpuikit 会直接编译失败）。所以这里用 `=` 而不是 `^`。
gpui = { package = "gpui-unofficial", version = "=1.14.2" }
# 窗口平台层：gpui 自己不提供，必须由应用指定一个。
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.14.2", features = [
    "font-kit",
] }
# 组件库：按钮、输入框、下拉框、进度条、对话框、主题与图标。
#
# 走 vendor/ 里的 0.9.0 副本（见文件末尾的 [patch.crates-io]），因为上游的
# Select 弹层宽度写死按内容排版、且不给应用任何旋钮，而这里的下拉框必须和
# 触发框同宽。补丁只有二十来行，见 vendor/gpuikit/PATCH.md。
gpuikit = "0.9"

log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-util = "0.7"
# 分流器的直连出口要「按出接口选路」：Windows 上是 IP_UNICAST_IF，Linux 上是
# SO_BINDTODEVICE。std 的 TcpStream 没有这个能力，这里用 socket2 建 socket 并
# 拿到原始句柄自己 setsockopt。它在依赖树里本来就存在（tokio 间接依赖），不增
# 加下载量。
socket2 = "0.6"
# 只用到 IpCidr / IpCidrSet，关掉默认特性避免拖进整个 tproxy 运行时。
tproxy-config = { version = "7.0.9", default-features = false }

[build-dependencies]
# 只干一件事：把 app.rc（图标 + 版本信息）编进 exe 的资源段。
# 非 Windows 平台上它什么也不做（build.rs 里已经用 cfg 圈住了）。
embed-resource = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 上 `--unshare` 可以免 root 运行，所以保留默认特性。
tun2proxy = "0.8.6"
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Windows / macOS 只用到 Args 与 general_run_async，不需要 unshare。
tun2proxy = { version = "0.8.6", default-features = false, features = ["udpgw"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_System_Threading",
    # 日志时间戳要取本地时间（GetLocalTime 在这个特性下）。
    "Win32_System_SystemInformation",
    # WNDCLASSW / RegisterClassW（托盘的自建窗口类）被 GDI 特性挡在后面，
    # 只开 Win32_UI_WindowsAndMessaging 是找不到的。
    "Win32_Graphics_Gdi",
    # DwmSetWindowAttribute：让原生标题栏跟随界面的深浅。
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # 「跟随系统」主题要读 AppsUseLightTheme 这个注册表值。
    "Win32_System_Registry",
    # GetIfTable2：按名字找 TUN 网卡，读它的收发字节数（流量折线图）。
    # MIB_IF_ROW2 的 OperStatus 类型在 Ndis 特性后面，所以两个都要开。
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }
# 托盘图标按状态着色：ico 里的帧是 PNG，要解码改像素再编码回去。
# 纯 Rust、无系统依赖，只在 Windows 上编进来。
png = "0.17"

# 发布版：去掉符号表，用 thin LTO 平衡编译时间与运行性能。
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 16

# gpuikit 0.9.0 的本地副本。上游 `Select` 把弹层宽度交给了内容（只有
# `min_w(120px)`），触发框多宽它都不管，应用侧拿不到任何开关；`Listbox`
# 又是 `pub(crate)`，没法在应用里拼一个同宽的。所以这里只给 `Select` 加一个
# `popup_width`，让弹层跟着触发框走，其余逻辑原样不动。
#
# 升级 gpui / gpuikit 时：把新版源码重新拷到 vendor/gpuikit，再按
# vendor/gpuikit/PATCH.md 里的清单重打一遍；上游补了这个 API 就可以删掉本段。
[patch.crates-io]
gpuikit = { path = "vendor/gpuikit" }
