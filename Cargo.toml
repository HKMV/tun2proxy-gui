[package]
name = "tun2proxy-gui"
version = "0.6.5"
edition = "2021"
# nsh 0.6.1 要求 rustc 1.97 起（GPUI 时代是 1.95）。
rust-version = "1.97"
description = "Cross-platform desktop GUI for tun2proxy"
authors = ["HKMV"]
license = "MIT"
repository = "https://github.com/HKMV/tun2proxy-gui"

[lib]
name = "tun2proxy_gui"
path = "src/lib.rs"

[[bin]]
name = "tun2proxy-gui"
path = "src/main.rs"

[dependencies]
# 界面框架：Native Shell（nsh）。它是「无样式的原生基础组件 + 引擎」，界面
# 的外观全部由本仓库的 ui 层用主题 token 自己画。
#
# 和 GPUI 时代的两点不同：
# - 不再需要单独的 `gpui_platform`——nsh 的平台 crate 自带窗口；
# - 不再需要 `[patch.crates-io]` 的本地副本（gpuikit 的 Select 弹层宽度补丁已
#   随 gpuikit 一起删掉）。
nsh-core = "0.7.2"
nsh-base = { version = "0.7.2", default-features = false }

log = { version = "0.4", features = ["std"] }
# 日志：tracing 生态（与 devroute 同一套写法）。
#
# - `tracing`：打点接口；
# - `tracing-subscriber`：订阅端（`time` 特性给 `OffsetTime`，按东八区打时间）；
# - `tracing-appender`：按天滚动写文件，自带 `max_log_files` 清理；
# - `time`：时间格式（`[hour]:[minute]:[second]` 与毫秒）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["local-offset", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
# 分流器的直连出口要「按出接口选路」：Windows 上是 IP_UNICAST_IF，Linux 上是
# SO_BINDTODEVICE。std 的 TcpStream 没有这个能力，这里用 socket2 建 socket 并
# 拿到原始句柄自己 setsockopt。
socket2 = "0.6"
# 只用到 IpCidr / IpCidrSet，关掉默认特性避免拖进整个 tproxy 运行时。
tproxy-config = { version = "7.0.10", default-features = false }

[build-dependencies]
# 只干一件事：把 app.rc（图标 + 版本信息）编进 exe 的资源段。
# 非 Windows 平台上它什么也不做（build.rs 里已经用 cfg 圈住了）。
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
# root 检测（geteuid）、停子进程（SIGINT）、日志时间戳转本地时间（localtime_r）。
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# 平台层：Win32 的窗口与 Direct2D 绘制，`cargo run` 起程序时用它。
nsh-platform-windows = { version = "0.7.2", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_System_Threading",
    # WNDCLASSW / RegisterClassW（托盘的自建窗口类）被 GDI 特性挡在后面，
    # 只开 Win32_UI_WindowsAndMessaging 是找不到的。
    "Win32_Graphics_Gdi",
    # DwmSetWindowAttribute：让原生标题栏跟随界面的深浅。
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # 「跟随系统」主题要读 AppsUseLightTheme 这个注册表值。
    "Win32_System_Registry",
    # GetIfTable2：按名字找 TUN 网卡，读它的收发字节数（流量折线图）。
    # MIB_IF_ROW2 的 OperStatus 类型在 Ndis 特性后面，所以两个都要开。
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    # GetAdaptersAddresses（本机网卡网段 → 直连规则，见 core::split::hostnet）
    # 的结构体里带 SOCKET_ADDRESS，它定义在 WinSock 特性后面。
    "Win32_Networking_WinSock",
    # SetupAPI：启动前删掉本程序留下、当前不在用的隧道网卡
    # （SetupDiGetClassDevsW / DIF_REMOVE，见 core::adapters）。
    "Win32_Devices_DeviceAndDriverInstallation",
    # ToolHelp32：启动前找出上一次留下的孤儿 tun2proxy 进程
    # （CreateToolhelp32Snapshot / Process32NextW，见 core::orphans）。
    "Win32_System_Diagnostics_ToolHelp",
] }

# 发布版：一切为了**体积**，编译时间让给 CI。
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# 注意：这条会让 `cargo test --release` 失效（测试框架需要展开）。
panic = "abort"
strip = "symbols"
